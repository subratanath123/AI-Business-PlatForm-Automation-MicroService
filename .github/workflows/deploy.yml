name: Deploy to Digital Ocean

on:
  push:
    branches:
      - main
      - master
    # Don't redeploy when only docs / tooling that isn't part of the jar changed
    paths-ignore:
      - '**.md'
      - 'ai-context/**'
      - 'chat-widget/**'
      - '.cursor/**'
      - '.vscode/**'
      - '.idea/**'
      - '.cursorrules'
      - '*.code-workspace'
      - '*.postman_collection.json'
      - 'OPENAPI_SPECIFICATION.yaml'
      - 'platform-demo-chat.html'
      - 'mongodb-default-assistants.js'
      - 'render.yaml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - dev
          - qa
          - prod

# One deploy at a time; a newer push waits for (and supersedes queued) older ones
concurrency:
  group: deploy-jade-ai-bot
  cancel-in-progress: false

jobs:
  # Runs in parallel with the deploy so it never adds to deploy time
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle (with dependency + build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test --build-cache

  build-and-deploy:
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Caches ~/.gradle (wrapper, dependencies, build cache) between runs
      - name: Set up Gradle (with dependency + build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Gradle runs here on the runner, never inside the Docker image
      - name: Build application (bootJar)
        run: ./gradlew bootJar -x test --build-cache

      - name: Verify JAR exists
        run: |
          if [ ! -f "build/libs/JadeAiBot.jar" ]; then
            echo "Error: JAR file not found!"
            exit 1
          fi
          ls -lh build/libs/JadeAiBot.jar

      - name: Create deployment package
        run: |
          mkdir -p deploy

          cp Dockerfile deploy/
          cp docker-compose.* deploy/
          cp .dockerignore deploy/
          cp deploy.sh deploy/

          mkdir -p deploy/build/libs
          cp build/libs/JadeAiBot.jar deploy/build/libs/

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # printf keeps newlines; tr strips CR so a Windows-copied secret is a valid OpenSSH key.
          printf '%s\n' "${{ secrets.DROPLET_SSH }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "Public key from DROPLET_SSH (this step fails if the secret is not a valid private key):"
          ssh-keygen -y -f ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare deployment directory on droplet
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -T ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} << 'EOF'
            uname -a
            sudo mkdir -p /apps/jade-ai-bot/deployment /apps/jade-ai-bot/backups
            sudo chown -R $USER:$USER /apps/jade-ai-bot/deployment /apps/jade-ai-bot/backups
          EOF

      # rsync's delta transfer only sends the parts of the ~330 MB jar that changed
      # (dependency jars are stored uncompressed inside it). Falls back to the old
      # tarball upload if rsync isn't installed on the droplet.
      # The runner stages files in deploy/; the droplet receives them directly in
      # /apps/jade-ai-bot/deployment (jar stays at build/libs/JadeAiBot.jar).
      - name: Transfer deployment files to droplet
        run: |
          TARGET="${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}"
          # $HOME (not ~) because tilde does not expand inside the rsync -e string.
          if ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes "$TARGET" "command -v rsync" > /dev/null 2>&1; then
            rsync -rlt --compress --stats -e "ssh -i $HOME/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes" deploy/ "$TARGET:/apps/jade-ai-bot/deployment/"
          else
            echo "rsync not found on droplet, falling back to tar + scp"
            tar -czf deploy.tar.gz -C deploy .
            scp -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes deploy.tar.gz "$TARGET:/tmp/"
            ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes "$TARGET" "tar -xzf /tmp/deploy.tar.gz -C /apps/jade-ai-bot/deployment && rm -f /tmp/deploy.tar.gz"
          fi

      - name: Deploy on droplet
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o BatchMode=yes -T ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} << 'EOF'
            set -e
            ENVIRONMENT="${ENVIRONMENT:-prod}"

            cd /apps/jade-ai-bot/deployment
            ls -la
            chmod +x deploy.sh
            ./deploy.sh prod
          EOF
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}

      - name: Cleanup
        if: always()
        run: |
          rm -f deploy.tar.gz
          rm -rf deploy
