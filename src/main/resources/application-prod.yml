server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: always

spring:
  application:
    name: OpenAiChatService
  mvc:
    static-path-pattern: /static/**
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  cloud:
    bootstrap:
      enabled: false
    config:
      profile: prod
      discovery:
        enabled: false
      enabled: true
      uri: http://143.198.58.6:8887
      fail-fast: true
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 6
        max-interval: 2000
        multiplier: 1.1
      import-check:
        enabled: false

  config:
    import: "configserver:http://143.198.58.6:8887/"

eureka:
  instance:
    preferIpAddress: true
  client:
    registerWithEureka: true
    fetchRegistry: true
    enabled: true
    serviceUrl:
      defaultZone: http://143.198.58.6:8761/eureka/

logging:
  level:
    org:
      springframework:
        cloud: DEBUG
    com.amazonaws: DEBUG
    io.awspring.cloud: DEBUG
