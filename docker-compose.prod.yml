services:
  jade-ai-bot:
    build:
      context: .
    container_name: jade-ai-bot-prod
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_OPTS=-Xmx1024m -Xms512m
      - SPRING_CLOUD_CONFIG_URI=http://10.132.0.2:8887
      - SPRING_CLOUD_CONFIG_DISCOVERY_ENABLED=false
      - SPRING_CLOUD_BOOTSTRAP_ENABLED=false
    volumes:
      # Keep Playwright's downloaded Chromium across redeploys instead of re-downloading it per container
      - playwright-browsers:/root/.cache/ms-playwright
    networks:
      - chatbot-network
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  chatbot-network:
    driver: bridge

volumes:
  playwright-browsers:

